name: PX / EXEC-S3 INT1 Fixture Confinement
on:
  pull_request:
    paths:
      - 'tests/px_int1_fixture.py'
      - 'tests/test-pxd-exec-s3-int1-p1.py'
      - '.github/workflows/px-exec-s3-int1-p1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-confinement:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile fixture code without PX execution
        run: |
          python3 -B -m py_compile tests/px_int1_fixture.py tests/test-pxd-exec-s3-int1-p1.py
      - name: INT1-P1 disposable SQLite canary, safe setup and refusal tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test-pxd-exec-s3-int1-p1.py
