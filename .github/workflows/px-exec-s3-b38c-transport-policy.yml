name: PX EXEC-S3 B38-C offline credential transport

on:
  pull_request:
    paths:
      - 'bin/px_s3_b38c_transport_policy_fixture.py'
      - 'tests/test-pxd-exec-s3-b38c-transport-policy.py'
      - 'MODEL/contracts/exec-s3-b38c-credential-transport-boundary.md'
      - '.github/workflows/px-exec-s3-b38c-transport-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-transport-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: B38-C and parent B38/B37 synthetic regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B tests/test-pxd-exec-s3-b38c-transport-policy.py
          python3 -B tests/test-pxd-exec-s3-b38b-trusted-sender-mock.py
          python3 -B tests/test-pxd-exec-s3-b38a-model-only-mock-client.py
          python3 -B tests/test-pxd-exec-s3-b37b-sealed-handoff.py
          python3 -B tests/test-pxd-exec-s3-b37a-tool-free-contract.py
