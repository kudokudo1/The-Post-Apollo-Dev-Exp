name: PX EXEC-S3 B38-C mandatory offline sender policy gate

on:
  pull_request:
    paths:
      - 'bin/px_s3_b38b_trusted_sender_mock.py'
      - 'tests/test-pxd-exec-s3-b38-policy-default-gate.py'
      - 'MODEL/contracts/exec-s3-b38-policy-default-sender-gate.md'
      - '.github/workflows/px-exec-s3-b38-policy-default-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-policy-before-mock:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact generated PR merge commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Print source identity and check policy call presence
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "B38_POLICY_EXECUTION_SHA=$(git rev-parse HEAD)"
          echo "B38_POLICY_PR_HEAD=$PR_HEAD_SHA"
          echo "B38_POLICY_PR_BASE=$PR_BASE_SHA"
          python3 -B - <<'PY'
          from pathlib import Path
          source = Path("bin/px_s3_b38b_trusted_sender_mock.py").read_text()
          for symbol in ("prepare_fake_plan(", "recheck_fake_plan(", "atomic",
                         "FAKE_POLICY_RECHECK_REFUSED"):
              assert symbol in source, symbol
          assert "mock_handoff(" not in source
          PY
      - name: Dedicated negative and positive offline sender policy cases
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test-pxd-exec-s3-b38-policy-default-gate.py
      - name: Existing B38-B mock sender cases
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test-pxd-exec-s3-b38b-trusted-sender-mock.py
      - name: Existing B38-C standalone policy cases
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test-pxd-exec-s3-b38c-transport-policy.py
      - name: Existing combined atomic default cases
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test-pxd-exec-s3-b38-default-atomic-integration.py
      - name: Existing B38-A mock text-only cases
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test-pxd-exec-s3-b38a-model-only-mock-client.py
      - name: Existing B37-C atomic recovery cases
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test-pxd-exec-s3-b37c-atomic-recovery.py
      - name: Existing B37-A/B seals and limits
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test-pxd-exec-s3-b37b-sealed-handoff.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test-pxd-exec-s3-b37a-tool-free-contract.py
