name: PX EXEC-S3 B38-B synthetic trusted sender

on:
  pull_request:
    paths:
      - 'bin/px_s3_b38b_trusted_sender_mock.py'
      - 'tests/test-pxd-exec-s3-b38b-trusted-sender-mock.py'
      - 'MODEL/contracts/exec-s3-b38b-trusted-sender-mock.md'
      - '.github/workflows/px-exec-s3-b38b-trusted-sender-mock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-trusted-sender:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic sender and parent B38-A / B37 regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B tests/test-pxd-exec-s3-b38b-trusted-sender-mock.py
          python3 -B tests/test-pxd-exec-s3-b38a-model-only-mock-client.py
          python3 -B tests/test-pxd-exec-s3-b37b-sealed-handoff.py
          python3 -B tests/test-pxd-exec-s3-b37a-tool-free-contract.py
