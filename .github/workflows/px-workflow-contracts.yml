name: PX / WORKFLOW CONTRACTS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - bin/px
      - bin/px-tools
      - bin/px-resolve
      - bin/px-term
      - bin/px-operation-store
      - term-exp/**
      - config/actions.json
      - config/repos.tsv
      - docs/workflow-factory.md
      - docs/tool-registry.md
      - docs/tool-resolver.md
      - docs/term-exp.md
      - tests/test-px-actions.sh
      - tests/test-px-operation-journal.py
      - tests/test-px-mutation-guards.sh
      - tests/test-px-tools.sh
      - tests/test-px-resolver.sh
      - tests/test-px-factory.sh
      - tests/test-px-runs.sh
      - tests/test-px-delete-workflow.sh
      - .github/workflows/px-workflow-contracts.yml
  push:
    branches:
      - main
    paths:
      - bin/px
      - bin/px-tools
      - bin/px-resolve
      - bin/px-term
      - bin/px-operation-store
      - term-exp/**
      - config/actions.json
      - config/repos.tsv
      - docs/workflow-factory.md
      - docs/tool-registry.md
      - docs/tool-resolver.md
      - docs/term-exp.md
      - tests/test-px-actions.sh
      - tests/test-px-operation-journal.py
      - tests/test-px-mutation-guards.sh
      - tests/test-px-tools.sh
      - tests/test-px-resolver.sh
      - tests/test-px-factory.sh
      - tests/test-px-runs.sh
      - tests/test-px-delete-workflow.sh
      - .github/workflows/px-workflow-contracts.yml

permissions:
  contents: read

jobs:
  contracts:
    name: Workflow control contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate contract script syntax
        run: |
          bash -n bin/px
          bash -n bin/px-term
          python3 -m py_compile bin/px-tools bin/px-resolve bin/px-operation-store
          python3 -m py_compile tests/test-px-operation-journal.py
          bash -n tests/test-px-mutation-guards.sh
          bash -n tests/test-px-actions.sh
          bash -n tests/test-px-tools.sh
          bash -n tests/test-px-resolver.sh
          bash -n tests/test-px-factory.sh
          bash -n tests/test-px-runs.sh
          bash -n tests/test-px-delete-workflow.sh

      - name: Build and test PX TERM EXP
        run: cargo test --manifest-path term-exp/Cargo.toml

      - name: Test PX action registry
        run: bash ./tests/test-px-actions.sh

      - name: Test PX operation journal
        run: python3 ./tests/test-px-operation-journal.py

      - name: Test guarded PX mutations
        run: bash ./tests/test-px-mutation-guards.sh

      - name: Test PX tool registry
        run: bash ./tests/test-px-tools.sh

      - name: Test PX tool resolver
        run: bash ./tests/test-px-resolver.sh

      - name: Test workflow factory
        run: ./tests/test-px-factory.sh

      - name: Test exact-SHA run evidence
        run: bash ./tests/test-px-runs.sh

      - name: Test guarded workflow deletion
        run: bash ./tests/test-px-delete-workflow.sh
