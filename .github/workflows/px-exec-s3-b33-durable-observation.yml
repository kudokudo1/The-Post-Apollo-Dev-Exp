name: PX / EXEC-S3 B34 Merged-Main Offline Integration

on:
  pull_request:
    paths:
      - 'bin/px_s3_*.py'
      - 'bin/px-agent'
      - 'tests/test-pxd-exec-s3-*.py'
      - 'MODEL/contracts/exec-s3-doctor-execution-isolation.md'
      - '.github/workflows/px-exec-s3-b33-durable-observation.yml'
  push:
    branches: [main]
    paths:
      - 'bin/px_s3_*.py'
      - 'bin/px-agent'
      - 'tests/test-pxd-exec-s3-*.py'
      - 'MODEL/contracts/exec-s3-doctor-execution-isolation.md'
      - '.github/workflows/px-exec-s3-b33-durable-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landed-main-baseline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact current main base, not any draft-PR dependency
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Verify tested checkout is the exact merged main base
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          echo "MERGED_MAIN_BASE_VERIFIED=$EXPECTED_BASE_SHA"
      - name: B24-B33 suites directly from merged main (274 expected)
        run: |
          for test in tests/test-pxd-exec-s3-b33-durable-observation.py tests/test-pxd-exec-s3-b32-staged-evidence.py tests/test-pxd-exec-s3-b30-integrated-fixture.py tests/test-pxd-exec-s3-b31-evidence-boundary.py tests/test-pxd-exec-s3-b29-transport-ledger.py tests/test-pxd-exec-s3-b27-stream-compat.py tests/test-pxd-exec-s3-b25-responses-fixtures.py tests/test-pxd-exec-s3-b24-provider-admission.py; do
            echo "RUNNING $test"
            PYTHONDONTWRITEBYTECODE=1 python3 -B "$test"
          done

  integration-on-triggering-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout event commit without extra dependency trees
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact checkout commit
        run: |
          echo "B34_EXECUTION_SHA=$(git rev-parse HEAD)"
      - name: B36 Hermes recovery authority fence (disposable fixtures only; 23 expected)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test-pxd-exec-s3-b36-hermes-recovery-fence.py
      - name: B35 provider executable inventory (fake-files only; 20 expected)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test-pxd-exec-s3-b35-provider-inventory.py
      - name: Run merged-tree provenance and lifecycle gate (B34)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test-pxd-exec-s3-b34-merged-main.py
      - name: Preserve all B24-B33 suites from the SAME checkout (274 expected)
        run: |
          for test in tests/test-pxd-exec-s3-b33-durable-observation.py tests/test-pxd-exec-s3-b32-staged-evidence.py tests/test-pxd-exec-s3-b30-integrated-fixture.py tests/test-pxd-exec-s3-b31-evidence-boundary.py tests/test-pxd-exec-s3-b29-transport-ledger.py tests/test-pxd-exec-s3-b27-stream-compat.py tests/test-pxd-exec-s3-b25-responses-fixtures.py tests/test-pxd-exec-s3-b24-provider-admission.py; do
            echo "RUNNING $test"
            PYTHONDONTWRITEBYTECODE=1 python3 -B "$test"
          done
