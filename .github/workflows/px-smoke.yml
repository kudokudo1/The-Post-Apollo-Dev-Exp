name: PX / SMOKE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - bin/px
      - config/repos.tsv
      - .github/workflows/px-smoke.yml
  push:
    branches:
      - main
      - automation/px-control-bus-v0
      - automation/px-workflow-factory-v0
      - automation/px-json-contract-v0
      - automation/px-repo-identity-v0
      - automation/px-empty-workflows-v0
    paths:
      - bin/px
      - config/repos.tsv
      - .github/workflows/px-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    name: PX is alive
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PX shell syntax
        run: bash -n bin/px

      - name: Exercise fundamental PX commands
        run: |
          ./bin/px repos
          ./bin/px --help
          ./bin/px templates

      - name: Report execution identity
        run: |
          echo "PX smoke test passed"
          echo "repo=$GITHUB_REPOSITORY"
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
