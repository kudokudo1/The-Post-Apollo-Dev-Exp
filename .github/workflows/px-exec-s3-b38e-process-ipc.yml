name: PX EXEC-S3 B38-E separate fake model process IPC

on:
  pull_request:
    paths:
      - 'bin/px_s3_b38e_fake_process_ipc.py'
      - 'tests/test-pxd-exec-s3-b38e-process-ipc.py'
      - 'MODEL/contracts/exec-s3-b38e-fake-model-process-ipc.md'
      - '.github/workflows/px-exec-s3-b38e-process-ipc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b38e-fake-process-ipc:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact PR merge checkout identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "B38E_EXECUTION_SHA=$(git rev-parse HEAD)"
          echo "B38E_PR_HEAD_SHA=$PR_HEAD_SHA"
          echo "B38E_PR_BASE_SHA=$PR_BASE_SHA"
      - name: Real separate Python subprocess and fake signed stdio negative tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B tests/test-pxd-exec-s3-b38e-process-ipc.py
      - name: Strict B38-B policy and B37-C atomic default regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B tests/test-pxd-exec-s3-b38-policy-default-gate.py
          python3 -B tests/test-pxd-exec-s3-b38-default-atomic-integration.py
          python3 -B tests/test-pxd-exec-s3-b38b-trusted-sender-mock.py
          python3 -B tests/test-pxd-exec-s3-b38c-transport-policy.py
          python3 -B tests/test-pxd-exec-s3-b38a-model-only-mock-client.py
          python3 -B tests/test-pxd-exec-s3-b37c-atomic-recovery.py
          python3 -B tests/test-pxd-exec-s3-b37b-sealed-handoff.py
          python3 -B tests/test-pxd-exec-s3-b37a-tool-free-contract.py
          python3 -B tests/test-pxd-exec-s3-b38d-os-boundary.py --unit
