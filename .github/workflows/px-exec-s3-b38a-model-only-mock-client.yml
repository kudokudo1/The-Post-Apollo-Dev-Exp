name: PX EXEC-S3 B38-A model-only mock client

on:
  pull_request:
    paths:
      - 'bin/px_s3_b38a_model_only_mock_client.py'
      - 'tests/test-pxd-exec-s3-b38a-model-only-mock-client.py'
      - 'MODEL/contracts/exec-s3-b38a-px-model-only-mock-client.md'
      - '.github/workflows/px-exec-s3-b38a-model-only-mock-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-only-mock-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Mock client and existing sealed-request regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B tests/test-pxd-exec-s3-b38a-model-only-mock-client.py
          python3 -B tests/test-pxd-exec-s3-b37b-sealed-handoff.py
          python3 -B tests/test-pxd-exec-s3-b37a-tool-free-contract.py
