name: PX / EXEC-S2 OFFLINE CREDENTIAL BOUNDARY

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tests/test-pxd-exec-s2-credential-boundary.py
      - tests/test-pxd-exec-s1-isolation.py
      - docs/hospital/EXEC_S2_FAKE_CLIENT_TOOL_BOUNDARY.md
      - .github/workflows/px-exec-s2-credential-boundary.yml

permissions:
  contents: read

jobs:
  exec-s2:
    name: Trusted fake client and isolated tool (no real providers)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed trusted Bubblewrap on disposable CI runner
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Test fake-client authorization and fail-closed refusals
        run: |
          python3 -m py_compile tests/test-pxd-exec-s2-credential-boundary.py
          python3 -B tests/test-pxd-exec-s2-credential-boundary.py --unit
      - name: Verify OS-separated fake-client and tool process
        run: python3 -B tests/test-pxd-exec-s2-credential-boundary.py --smoke
