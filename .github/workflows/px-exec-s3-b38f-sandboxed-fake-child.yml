name: PX EXEC-S3 B38-F sandboxed B38-E fake model child

on:
  pull_request:
    paths:
      - 'tests/test-pxd-exec-s3-b38f-sandboxed-fake-child.py'
      - 'MODEL/contracts/exec-s3-b38f-sandboxed-fake-child.md'
      - '.github/workflows/px-exec-s3-b38f-sandboxed-fake-child.yml'
      - 'bin/px_s3_b38e_fake_process_ipc.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b38f-sandboxed-fake-child:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR merge tree, no stored Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show base, head and generated merge checkout SHA
        env:
          PR_HEAD_SHA: \${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: \${{ github.event.pull_request.base.sha }}
        run: |
          echo "B38F_EXECUTION_SHA=$(git rev-parse HEAD)"
          echo "B38F_PR_HEAD_SHA=$PR_HEAD_SHA"
          echo "B38F_PR_BASE_SHA=$PR_BASE_SHA"
          git status --porcelain
      - name: Install trusted Bubblewrap on disposable Ubuntu runner
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: No-sandbox-fallback and strict contract unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B tests/test-pxd-exec-s3-b38f-sandboxed-fake-child.py --unit
      - name: Actual B38-E child process in S1 sandbox with live PID FD network observations
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B tests/test-pxd-exec-s3-b38f-sandboxed-fake-child.py --smoke
      - name: Regressions of B38-E and merged B38-D / B38-B / B37-C security seams
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B tests/test-pxd-exec-s3-b38e-process-ipc.py
          python3 -B tests/test-pxd-exec-s3-b38d-os-boundary.py --unit
          python3 -B tests/test-pxd-exec-s3-b38-policy-default-gate.py
          python3 -B tests/test-pxd-exec-s3-b38-default-atomic-integration.py
          python3 -B tests/test-pxd-exec-s3-b38b-trusted-sender-mock.py
          python3 -B tests/test-pxd-exec-s3-b38c-transport-policy.py
          python3 -B tests/test-pxd-exec-s3-b38a-model-only-mock-client.py
          python3 -B tests/test-pxd-exec-s3-b37c-atomic-recovery.py
          python3 -B tests/test-pxd-exec-s3-b37b-sealed-handoff.py
          python3 -B tests/test-pxd-exec-s3-b37a-tool-free-contract.py
          python3 -B tests/test-pxd-exec-s3-b38d-os-boundary.py --smoke
