name: PX EXEC-S3 B37-C B38 default atomic integration

on:
  pull_request:
    paths:
      - 'bin/px_s3_b38a_model_only_mock_client.py'
      - 'bin/px_s3_b38b_trusted_sender_mock.py'
      - 'tests/test-pxd-exec-s3-b38a-model-only-mock-client.py'
      - 'tests/test-pxd-exec-s3-b38b-trusted-sender-mock.py'
      - 'tests/test-pxd-exec-s3-b38-default-atomic-integration.py'
      - 'MODEL/contracts/exec-s3-b38-default-atomic-integration.md'
      - '.github/workflows/px-exec-s3-b38-default-atomic-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b37c-b38-default-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Print exact integration and PR-base identities
        shell: bash
        run: |
          echo "INTEGRATION_TREE_SHA=$(git rev-parse HEAD)"
          echo "PR_BASE_SHA=${{ github.event.pull_request.base.sha }}"
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
      - name: Assert B37-C merged source and absence of unguarded handoff
        run: |
          test -f bin/px_s3_b37c_atomic_recovery_fixture.py
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          t = ast.parse(Path("bin/px_s3_b38a_model_only_mock_client.py").read_text())
          calls = {n.func.id for n in ast.walk(t) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name)}
          imports = {a.name for n in ast.walk(t) if isinstance(n, ast.ImportFrom) for a in n.names}
          assert "mock_handoff" not in calls
          assert "mock_handoff" not in imports
          assert "AtomicOfflineFixture" in imports
          PY
      - name: Combined atomic, B38 and B37 independent regressions (fake only)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B tests/test-pxd-exec-s3-b38-default-atomic-integration.py
          python3 -B tests/test-pxd-exec-s3-b38a-model-only-mock-client.py
          python3 -B tests/test-pxd-exec-s3-b38b-trusted-sender-mock.py
          python3 -B tests/test-pxd-exec-s3-b38c-transport-policy.py
          python3 -B tests/test-pxd-exec-s3-b37c-atomic-recovery.py
          python3 -B tests/test-pxd-exec-s3-b37b-sealed-handoff.py
          python3 -B tests/test-pxd-exec-s3-b37a-tool-free-contract.py
