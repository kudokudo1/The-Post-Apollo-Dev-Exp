name: PX / HOSPITAL STORE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - bin/px
      - bin/px-hospital-store
      - bin/px_hospital_room_lifecycle.py
      - bin/px_hospital_room_authority.py
      - tests/test-px-hospital-store.sh
      - tests/test-px-hospital-room-names.py
      - tests/test-px-hospital-room-lifecycle-v12.py
      - tests/test-px-hospital-unprotected-writer-witness.py
      - .github/workflows/px-hospital-store.yml
  push:
    branches:
      - main
    paths:
      - bin/px
      - bin/px-hospital-store
      - tests/test-px-hospital-store.sh
      - tests/test-px-hospital-room-names.py
      - tests/test-px-hospital-room-lifecycle-v12.py
      - tests/test-px-hospital-unprotected-writer-witness.py
      - .github/workflows/px-hospital-store.yml

permissions:
  contents: read

jobs:
  hospital-store:
    name: Hospital durable state store
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Ed25519 verifier dependency
        run: python3 -m pip install 'cryptography==46.0.3'

      - name: Validate Hospital store syntax
        run: |
          bash -n tests/test-px-hospital-store.sh
          python3 -m py_compile bin/px-hospital-store bin/px_hospital_room_lifecycle.py bin/px_hospital_room_authority.py tests/test-px-hospital-room-names.py tests/test-px-hospital-room-lifecycle-v12.py tests/test-px-hospital-unprotected-writer-witness.py

      - name: Test Hospital durable state store
        run: |
          bash ./tests/test-px-hospital-store.sh
          python3 tests/test-px-hospital-room-names.py
          python3 tests/test-px-hospital-room-lifecycle-v12.py
      - name: Record unprotected same-UID SQLite bypass on disposable fixture (negative security evidence)
        run: python3 tests/test-px-hospital-unprotected-writer-witness.py
